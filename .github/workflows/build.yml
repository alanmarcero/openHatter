name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenHatter_artefacts/Release

jobs:
  macos:
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openHatter.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openHatter.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openHatter.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openHatter.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openHatter.vst3" "dist/openHatter.vst3"
          ditto "$ARTEFACTS/AU/openHatter.component" "dist/openHatter.component"
          ditto "$ARTEFACTS/LV2/openHatter.lv2" "dist/openHatter.lv2"
          ditto "$ARTEFACTS/Standalone/openHatter.app" "dist/openHatter.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openHatter-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openHatter-macOS
          path: openHatter-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openHatter.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openHatter.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openHatter.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openHatter.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openHatter-Windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openHatter-Windows
          path: openHatter-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openHatter.vst3" "$ARTEFACTS/LV2/openHatter.lv2" dist/
          cp "$ARTEFACTS/Standalone/openHatter" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openHatter-Linux.zip .)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openHatter-Linux
          path: openHatter-Linux.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Write release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(python3 scripts/release_notes.py "$TAG")
          screenshot="![openHatter native editor](https://raw.githubusercontent.com/alanmarcero/openHatter/${TAG}/docs/screenshots/preview.png)"
          {
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf '%s\n' "$screenshot"
          } > "$RUNNER_TEMP/release-body.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/openHatter-*.zip
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true

  update-preview:
    # OpenVST Manager and the README read docs/screenshots/preview.png from main.
    # This job is separate from the macOS and Linux package jobs, which stay disabled.
    # A job that needs a skipped job is skipped too, so this one builds and captures on its own.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build editor tests
        run: cmake --build build --config Release --parallel --target openhatter_plugin_tests

      - name: Capture factory-default editor
        run: |
          mkdir -p build/shots
          xvfb-run -a -s "-screen 0 1400x1200x24" env OPENHATTER_CAPTURE_DIR="$PWD/build/shots" ./build/openhatter_plugin_tests '[plugin][gui]'
          cp build/shots/openHatter-hat.png docs/screenshots/preview.png

      - name: Commit refreshed preview if changed
        run: |
          if git diff --quiet -- docs/screenshots/preview.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
